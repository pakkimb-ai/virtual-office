<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7ec8e3" />
  <title>虛擬辦公室 · 動森風</title>
  <link rel="stylesheet" href="css/styles.css?v=16" />
</head>
<body>
  <div id="canvasHost" class="canvas-host" role="img" aria-label="動森風 3D 辦公室"></div>

  <button type="button" id="btnReset" class="reset-btn" title="重置視角" aria-label="重置視角">↺</button>
  <p class="hint" id="hint">拖曳旋轉 · 滾輪縮放 · 撳工位</p>

  <dialog id="deskDialog" class="bubble">
    <form method="dialog">
      <div class="bubble-tail" aria-hidden="true"></div>
      <header>
        <h2 id="dlgName">—</h2>
        <span id="dlgBadge" class="badge">—</span>
      </header>
      <p class="motto" id="dlgMotto"></p>
      <p class="task" id="dlgTask"></p>
      <button type="submit" class="close-btn">好呀</button>
    </form>
  </dialog>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/app.js?v=16"></script>
</body>
</html>
