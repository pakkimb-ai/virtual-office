<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2B1F3D" />
  <title>虛擬辦公室 🎃 · 動森風 3D</title>
  <link rel="stylesheet" href="css/styles.css?v=5" />
</head>
<body>
  <header class="top">
    <div class="title-wrap">
      <h1>虛擬辦公室 <span class="emoji">🎃</span></h1>
      <span class="season-pill">萬聖節 · 動森風 3D</span>
    </div>
    <p class="blurb">歡迎返辦公室——萬聖節主題，撳工位睇大家做緊咩。拖曳旋轉 · 滾輪縮放</p>
  </header>

  <div class="stage-wrap">
    <div id="canvasHost" class="canvas-host" role="img" aria-label="3D 動森風萬聖節辦公室"></div>
    <p class="hint">撳發光工位睇狀態 · 每張枱有專屬擺設</p>
  </div>

  <dialog id="deskDialog" class="desk-dialog">
    <form method="dialog">
      <header>
        <h2 id="dlgName">—</h2>
        <span id="dlgBadge" class="badge">—</span>
      </header>
      <p class="role" id="dlgRole"></p>
      <p class="task" id="dlgTask"></p>
      <p class="updated" id="dlgUpdated"></p>
      <button type="submit" class="close-btn">好呀</button>
    </form>
  </dialog>

  <footer class="foot">Creator: Paper P. · Three.js · 動森風卡通辦公室</footer>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
