<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A1224" />
  <title>虛擬辦公室 🎃 · 等距地圖</title>
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
  <div class="mist" aria-hidden="true"></div>
  <div class="bats" aria-hidden="true">🦇 🦇</div>

  <header class="top">
    <div class="title-wrap">
      <h1>虛擬辦公室 <span class="emoji">🎃</span></h1>
      <span class="season-pill">萬聖節 · 等距地圖 v1</span>
    </div>
    <p class="blurb">歡迎返虛擬辦公室——主題：萬聖節。一眼睇邊個忙、邊個閒。</p>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <!-- isometric room -->
      <div class="iso-room">
        <div class="floor"></div>
        <div class="wall-back"></div>
        <div class="wall-side"></div>
        <div class="deco pumpkin-a">🎃</div>
        <div class="deco pumpkin-b">🎃</div>
        <div class="deco bat-wall">🦇</div>
        <div class="deco lamp">🕯️</div>

        <button type="button" class="desk" data-id="grok" style="--x:18%; --y:42%">
          <span class="desk-3d"></span>
          <span class="chair"></span>
          <span class="lamp-dot busy" aria-hidden="true"></span>
          <span class="desk-label">Grok Bot</span>
        </button>
        <button type="button" class="desk" data-id="ai" style="--x:42%; --y:28%">
          <span class="desk-3d"></span>
          <span class="chair"></span>
          <span class="lamp-dot busy" aria-hidden="true"></span>
          <span class="desk-label">AI開發</span>
        </button>
        <button type="button" class="desk" data-id="design" style="--x:66%; --y:38%">
          <span class="desk-3d"></span>
          <span class="chair"></span>
          <span class="lamp-dot busy" aria-hidden="true"></span>
          <span class="desk-label">設計</span>
        </button>
        <button type="button" class="desk" data-id="write" style="--x:30%; --y:62%">
          <span class="desk-3d"></span>
          <span class="chair"></span>
          <span class="lamp-dot busy" aria-hidden="true"></span>
          <span class="desk-label">寫作</span>
        </button>
        <button type="button" class="desk" data-id="cut" style="--x:58%; --y:58%">
          <span class="desk-3d"></span>
          <span class="chair"></span>
          <span class="lamp-dot idle" aria-hidden="true"></span>
          <span class="desk-label">剪片</span>
        </button>

        <div class="screen-wall" title="剪片預覽屏">
          <div class="screen">
            <span>✂️ Showreel ready</span>
            <small>41s／1080p · 片頭／轉場 TBD</small>
          </div>
        </div>
      </div>
    </div>
    <p class="hint">撳橙色／綠色燈嘅工位睇狀態</p>
  </div>

  <dialog id="deskDialog" class="desk-dialog">
    <form method="dialog">
      <header>
        <h2 id="dlgName">—</h2>
        <span id="dlgBadge" class="badge">—</span>
      </header>
      <p class="role" id="dlgRole"></p>
      <p class="task" id="dlgTask"></p>
      <p class="updated" id="dlgUpdated"></p>
      <button type="submit" class="close-btn">收起</button>
    </form>
  </dialog>

  <footer class="foot">Creator: Paper P. · 等距卡通地圖（真 WebGL 3D 之後再升）</footer>
  <script src="js/app.js?v=3"></script>
</body>
</html>
